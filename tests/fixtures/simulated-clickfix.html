<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simulated ClickFix Security Test Fixture</title>
  <style>
    body { font-family: monospace; padding: 40px; background: #121212; color: #f0f0f0; }
    .box { border: 1px solid #333; padding: 20px; border-radius: 6px; max-width: 500px; margin: auto; }
    button { background: #222; color: #eee; border: 1px solid #444; padding: 10px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Cloud Verification Prompt</h2>
    <p>Please verify that you are human to proceed.</p>
    <p>Instructions: Press Win + R to open run dialog, then copy and paste the command below into powershell:</p>
    <code id="payload">powershell -WindowStyle Hidden -Command echo 'BENIGN_TEST_VERIFICATION'</code>
    <br><br>
    <button id="verify-btn">Verify Human Checkbox</button>
  </div>

  <script>
    document.getElementById("verify-btn").addEventListener("click", async () => {
      const code = document.getElementById("payload").innerText;
      try {
        await navigator.clipboard.writeText(code);
      } catch (e) {}
    });
  </script>
</body>
</html>
